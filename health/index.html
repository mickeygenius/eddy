function toast(m){const t=document.getElementById("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2200);}
function load(){
  try{const c=localStorage.getItem("sbsns_cloud");if(c){D=JSON.parse(c);}}catch(e){}
  if(!D||!D["体检记录"]||!D["体检记录"].length)D=JSON.parse(JSON.stringify(FALLBACK));
  try{custom=JSON.parse(localStorage.getItem("sbsns_custom")||"[]");}catch(e){custom=[];}
}
function allRecs(){const m={};(D["体检记录"]||[]).forEach(r=>{if(!m[r.id]||!r._c)m[r.id]=r;});custom.forEach(r=>m[r.id]=Object.assign({_c:1},r));return Object.values(m);}
function recsOf(mid){return allRecs().filter(r=>r.m===mid).sort((a,b)=>a.date<b.date?1:-1);}
function member(id){return (D["成员"]||[]).find(m=>m.id===id)||{id:id,name:id};}
function indKey(id){return (D["指标库"]||{})[id]||FALLBACK["指标库"][id]||{n:id,g:"其他",u:""};}
function num(x){return typeof x==="number"?x:(typeof x==="string"&&!isNaN(parseFloat(x))&&/^[\-\d.]+$/.test(x)?parseFloat(x):null);}
function flagOf(it){if(it.f)return it.f;const v=num(it.v);if(v==null)return "";if(it.lo!=null&&v<it.lo)return "↓";if(it.hi!=null&&v>it.hi)return "↑";return "";}
function badLevel(it){const f=flagOf(it);if(!f)return 0;const v=num(it.v);if(v==null)return 1;let d=0;if(f==="↑"&&it.hi!=null)d=(v-it.hi)/(Math.abs(it.hi)||1);if(f==="↓"&&it.lo!=null)d=(it.lo-v)/(Math.abs(it.lo)||1);return d>0.2?2:1;}
function fmtV(v){const n=num(v);if(n==null)return v;if(Math.abs(n)>=1000)return n.toLocaleString("zh-CN");return String(n);}
function daysSince(ds){const d=new Date(ds+"T00:00:00");return Math.floor((Date.now()-d.getTime())/86400000);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function render(){
  const mc=document.getElementById("mchips");
  mc.innerHTML=(D["成员"]||[]).map(m=>`<div class="mchip${m.id===cur?" on":""}" onclick="setM('${m.id}')">${esc(m.name)}</div>`).join("");
  if(tab==="ov")renderOV();else if(tab==="cv")renderCV();else renderDT();
}
function setM(id){cur=id;render();}
function setTab(t){tab=t;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));render();window.scrollTo(0,0);}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>setTab(b.dataset.t));

function remindCard(rs){
  if(!rs.length)return "";
  const base=rs.filter(r=>r.type==="年度体检"||r.type==="学生体检");
  const last=base.length?base[0]:rs[0],d=daysSince(last.date),fr=FREQ[cur]||365;
  const cls=d>fr+90?"bad":d>fr-30?"warn":"ok";
  const tip=d>fr?"已超过建议周期，建议尽快安排体检":d>fr-30?"临近体检周期，可以开始预约了":"体检记录很新，保持节奏";
  return `<div class="card"><h3>体检提醒<span class="sub">按年度体检日计算 · 建议每${fr}天一次</span></h3>
  <div class="remind"><div class="ring ${cls}"><b>${d}</b><span>天前</span></div>
  <div class="tx"><b>${esc(last.date)}</b> · ${esc(last.org||"")}<br>${tip}${base.length?"":'<br><span style="color:#b06f00">（暂无年度体检记录，暂按最近一次记录计）</span>'}</div></div></div>`;
}

function itemsTable(items){
  const ks=Object.keys(items||{});
  if(!ks.length)return `<p class="empty">本记录无定量指标</p>`;
  const rows=ks.map(k=>{
    const it=items[k],m=indKey(k),f=flagOf(it),lv=badLevel(it);
    const rng=(it.lo!=null||it.hi!=null)?(it.lo!=null?it.lo:"")+" ~ "+(it.hi!=null?it.hi:""):(it.rng||"—");
    return `<tr><td>${esc(m.n)}</td><td class="v ${lv===2?"up":f==="↑"?"up":f==="↓"?"dn":""}">${esc(fmtV(it.v))}${f?` ${f}`:""}${it.u?` <span style="color:#8a9a94;font-weight:400">${esc(it.u)}</span>`:""}</td><td class="r">${esc(rng)}</td></tr>`;
  }).join("");
  return `<table><tr><th>指标</th><th>结果</th><th>参考</th></tr>${rows}</table>`;
}

function renderOV(){
  const rs=recsOf(cur),v=document.getElementById("view");
  if(!rs.length){v.innerHTML=`<div class="card"><p class="empty">暂无${esc(member(cur).name)}的体检记录</p></div>`;return;}
  const latest=rs[0];
  const ab=Object.keys(latest.items||{}).filter(k=>flagOf(latest.items[k])).map(k=>({k,it:latest.items[k]}));
  const abHtml=ab.length?ab.map(x=>{const lv=badLevel(x.it);return `<span class="tag ${lv===2?"bad":"warn"}">${esc(indKey(x.k).n)} ${esc(fmtV(x.it.v))}${esc(flagOf(x.it))}</span>`;}).join(""):`<span class="tag">未见异常指标</span>`;
  const finds=(latest.findings||[]).map((f,i)=>`<li><b>${i+1}.</b> ${esc(f)}</li>`).join("");
  const tl=rs.map((r,i)=>`<div class="tlrow"><div class="hd" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">
    <span class="d">${esc(r.date)}</span><span class="t">${esc(r.type||"")}${r._c?" · 本地":""}</span><span class="a">${esc(r.org||"")} · ${Object.keys(r.items||{}).length}项 ▾</span></div>
    <div style="display:none;padding:0 2px 8px">${(r.findings||[]).length?`<ul class="find">${r.findings.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>`:""}${itemsTable(r.items)}${r.note?`<p class="note">${esc(r.note)}</p>`:""}</div></div>`).join("");
  v.innerHTML=`${remindCard(rs)}
  <div class="card"><h3>最近体检 · ${esc(latest.date)}<span class="sub">${esc(latest.type||"")}</span></h3>
    <p style="font-size:13px;color:#5a6b65;margin-bottom:8px">${esc(latest.org||"")}</p>
    <div class="chiprow">${abHtml}</div>
    ${finds?`<ul class="find">${finds}</ul>`:""}
    ${latest.note?`<p class="note">${esc(latest.note)}</p>`:""}</div>
  <div class="card"><h3>全部记录<span class="sub">${rs.length}次 · 点开看详情</span></h3><div class="tl">${tl}</div></div>`;
}

function tgG(el){const b=el.nextElementSibling,t=el.querySelector(".tri"),show=b.style.display==="none";b.style.display=show?"block":"none";t.textContent=show?"▼":"▶";}

function renderCV(){
  const v=document.getElementById("view");
  const recs=recsOf(cur).slice().sort((a,b)=>a.date<b.date?-1:1);
  const byInd={};
  recs.forEach(r=>{Object.keys(r.items||{}).forEach(k=>{const n=num(r.items[k].v);if(n!=null){(byInd[k]=byInd[k]||[]).push({d:r.date,v:n,it:r.items[k]});}});});
  const keys=Object.keys(byInd).sort((a,b)=>indKey(a).g===indKey(b).g?indKey(a).n.localeCompare(indKey(b).n,"zh"):indKey(a).g.localeCompare(indKey(b).g,"zh"));
  if(!keys.length){v.innerHTML=`<div class="card"><p class="empty">暂无可绘曲线的数值指标</p></div>`;return;}
  if(!curInd||!byInd[curInd])curInd=keys[0];
  const BIG=[["一般检查",["一般","血压"]],["眼科检查",["眼科"]],["实验室检查",["血常规","血脂","肝功能","肾功能","心脑血管","免疫","肿瘤标志物","胃功能","甲状腺","血糖","尿常规","妇科","幽门螺杆菌","粪便"]],["其他",["发展测评"]]];
  const gmap={};
  keys.forEach(k=>{(gmap[indKey(k).g]=gmap[indKey(k).g]||[]).push(k);});
  let cats="";
  BIG.forEach(bg=>{
    const bn=bg[0],subs=bg[1];
    const parts=[];
    subs.forEach(sg=>{
      const ks=gmap[sg]||[];
      if(!ks.length)return;
      const chipHtml=`${subs.length>1?`<div class="sg">${esc(sg)}</div>`:""}<div class="chiprow">${ks.map(k=>`<span class="ichip${k===curInd?" on":""}" onclick="curInd='${k}';renderCV()">${esc(indKey(k).n)}</span>`).join("")}</div>`;
      parts.push(chipHtml);
    });
    if(!parts.length)return;
    const n=parts.reduce((a,p)=>a+(p.match(/class="ichip/g)||[]).length,0);
    const open=parts.some(p=>p.includes(`'${curInd}'`))?"block":"none";
    cats+=`<div class="ghead" onclick="tgG(this)"><span class="tri">${open==="block"?"▼":"▶"}</span>${esc(bn)}<span class="cnt">${n}项</span></div><div class="gbody" style="display:${open}">${parts.join("")}</div>`;
  });
  const pts=byInd[curInd],m=indKey(curInd),last=pts[pts.length-1],first=pts[0];
  const lo=last.it.lo,hi=last.it.hi;
  const vals=pts.map(p=>p.v);let mn=Math.min(...vals),mx=Math.max(...vals);
  if(lo!=null)mn=Math.min(mn,lo);if(hi!=null)mx=Math.max(mx,hi);
  const pad=(mx-mn)*0.15||Math.abs(mx)*0.1||1;mn-=pad;mx+=pad;
  const W=340,H=190,L=40,R=10,T=14,B=30,iw=W-L-R,ih=H-T-B;
  const X=i=>pts.length===1?W/2-iw/2:L+iw*i/(pts.length-1);
  const Y=val=>T+ih*(1-(val-mn)/(mx-mn));
  const band=(lo!=null||hi!=null)?`<rect x="${L}" y="${Y(hi!=null?hi:mx)}" width="${iw}" height="${Math.max(1,Y(lo!=null?lo:mn)-Y(hi!=null?hi:mx))}" fill="#2b6cb0" opacity="0.10"/>`:"";
  const grid=[0,0.5,1].map(t=>{const gv=mn+(mx-mn)*(1-t);return `<line x1="${L}" y1="${T+ih*t}" x2="${W-R}" y2="${T+ih*t}" stroke="#e3ecf5"/><text class="axis" x="${L-4}" y="${T+ih*t+3}" text-anchor="end">${gv>=100?Math.round(gv):gv.toFixed(gv<10?1:0)}</text>`;}).join("");
  const poly=pts.map((p,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
  const dots=pts.map((p,i)=>{const f=p.it.lo!=null&&p.v<p.it.lo?"dn":p.it.hi!=null&&p.v>p.it.hi?"up":"";return `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3.5" fill="${f==="up"?"#c2452d":f==="dn"?"#2f7cc2":"#1d4e89"}" stroke="#fff" stroke-width="1.5"/>${pts.length<=12||i===pts.length-1?`<text class="axis" x="${X(i).toFixed(1)}" y="${(Y(p.v)-7).toFixed(1)}" text-anchor="middle" fill="${f==="up"?"#c2452d":"#1c2733"}">${p.v>=100?Math.round(p.v):p.v}</text>`:""}`;}).join("");
  const lbl=pts.map((p,i)=>(pts.length<=6||i%Math.ceil(pts.length/6)===0||i===pts.length-1)?`<text class="axis" x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle">${p.d.slice(0,7)}</text>`:"").join("");
  const dl=last.it.lo!=null||last.it.hi!=null?`（参考 ${(last.it.lo!=null?last.it.lo:"")} ~ ${(last.it.hi!=null?last.it.hi:"")}）`:"";
  const delta=pts.length>1?`较首次${last.v>=first.v?"+":""}${(last.v-first.v).toFixed(Math.abs(last.v-first.v)<1?2:1)}`:"仅一次记录";
  v.innerHTML=`<div class="card">${cats}</div>
  <div class="card"><h3>${esc(m.n)}<span class="sub">${esc(m.u||"")}${esc(dl)}</span></h3>
  <svg viewBox="0 0 ${W} ${H}" style="width:100%">${grid}${band}<path d="${poly}" fill="none" stroke="#2b6cb0" stroke-width="2"/>${dots}${lbl}</svg>
  <p class="legend">最新 <b style="color:#1d4e89">${last.v}</b>（${last.d}）· ${delta} · 蓝色带=参考区间 · 红点=超上限</p></div>`;
}

function renderDT(){
  const v=document.getElementById("view");
  const recs=allRecs().sort((a,b)=>a.m===b.m?(a.date<b.date?1:-1):a.m<b.m?-1:1);
  const list=recs.map(r=>{const mm=member(r.m);
    return `<details class="card" style="padding:0"><summary style="padding:13px 14px;display:flex;justify-content:space-between;align-items:center">
    <span><b style="color:${mc(r.m)}">●</b> ${esc(mm.name)} · ${esc(r.date)}</span>
    <span style="font-size:12px;color:#8a9a94">${esc(r.type||"")} ${r._c?"· 本地":""} ▾</span></summary>
    <div style="padding:0 14px 14px"><p style="font-size:12px;color:#8a9a94;margin-bottom:8px">${esc(r.org||"")}</p>
    ${(r.findings||[]).length?`<ul class="find">${r.findings.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>`:""}
    ${itemsTable(r.items)}${r.note?`<p class="note">${esc(r.note)}</p>`:""}</div></details>`;}).join("");
  v.innerHTML=`<div class="card"><h3>数据管理<span class="sub">${recs.length}条记录</span></h3>
  <button class="btn ghost" onclick="exportJSON()">导出全部数据(JSON备份)</button>
  <label style="display:block"><input type="file" id="impf" accept=".json" style="display:none" onchange="importJSON(this)">
  <span class="btn ghost" style="display:block;text-align:center;margin-top:8px">导入JSON数据</span></label>
  <button class="btn ghost" onclick="addRec()">手动添加体检记录</button>
  ${custom.length?`<button class="btn ghost" onclick="clearCustom()">清除本地手动记录(${custom.length})</button>`:""}
  <p class="note">云端JSON更新后点右上"刷新云端"即可同步；手动添加的记录仅存本机(localStorage)。</p></div>${list}`;
}
function mc(id){return {wo:"#2b6cb0",ba:"#4a90d9",ma:"#8e5bb8",nv:"#d4588a"}[id]||"#2b6cb0";}

function exportJSON(){
  const blob=new Blob([JSON.stringify({应用:"寿比南山",成员:D["成员"],指标库:D["指标库"],体检记录:allRecs()},null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="体检数据.json";a.click();
}
function importJSON(inp){
  const f=inp.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const j=JSON.parse(rd.result);if(!j["体检记录"])throw 0;
    if(j["成员"])D["成员"]=j["成员"];if(j["指标库"])D["指标库"]=j["指标库"];
    localStorage.setItem("sbsns_cloud",JSON.stringify(j));
    custom=custom.filter(c=>!j["体检记录"].some(r=>r.id===c.id));
    localStorage.setItem("sbsns_custom",JSON.stringify(custom));
    load();render();toast("导入成功");}catch(e){toast("文件格式不对");}};
  rd.readAsText(f,"utf-8");
}
function addRec(){
  const name=prompt("记录标题(如: 2027-5-1 复查)","");if(!name)return;
  const date=prompt("日期(YYYY-MM-DD)",new Date().toISOString().slice(0,10));if(!date)return;
  const org=prompt("机构","");const f=[];
  while(true){const x=prompt("结论/发现(留空结束)","");if(!x)break;f.push(x);}
  custom.push({id:"c"+Date.now(),m:cur,date:date,org:org||"手工录入",type:"手动",items:{},findings:f});
  localStorage.setItem("sbsns_custom",JSON.stringify(custom));render();toast("已添加(仅本机)");
}
function clearCustom(){if(!confirm("清除"+custom.length+"条手动记录?"))return;custom=[];localStorage.setItem("sbsns_custom","[]");render();}

function refreshCloud(){
  const si=document.getElementById("syncinfo");si.textContent="正在同步…";
  fetch("体检数据.json?ts="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json();})
  .then(j=>{if(!j["体检记录"])throw 0;localStorage.setItem("sbsns_cloud",JSON.stringify(j));D=j;load();render();
    si.textContent="云端已同步 · "+new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"});toast("已同步云端数据");})
  .catch(()=>{si.textContent="本地数据(云端暂不可用)";toast("云端暂不可达，用本地数据");});
}
window.addEventListener("error",e=>{console.warn("err:",e.message,"@",e.lineno);});

load();render();refreshCloud();
</script>
</body>
</html>
